input {
  file {
    path => "/data/events.jsonl"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_sectel"
    codec => json { ecs_compatibility => "disabled" }
    ecs_compatibility => "disabled"
  }
}

filter {
  date {
    match => ["received_at", "ISO8601"]
    target => "@timestamp"
  }
  mutate { rename => { "event" => "sectel_event" } }
  mutate {
    rename       => { "sectel_event" => "[event][action]" }
    add_field    => { "[event][dataset]" => "sectel.device" }
    remove_field => ["path", "host", "@version"]
  }
  if [event][action] == "decode_error" {
    mutate { add_tag => ["decode_error"] }
  }
  fingerprint {
    source => ["device_id", "received_at", "seq", "event_type_raw"]
    concatenate_sources => true
    method => "SHA1"
    target => "[@metadata][doc_id]"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "sectel-events-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][doc_id]}"
  }
}
