# Collector: read all device events; may send OTA commands (lab shortcut,
# in production use a separate operator identity).
user sectel-collector
topic read sectel/+/ev
topic write sectel/+/ota

# Every client (identified by certificate CN) may publish ONLY its own events
# and receive ONLY its own OTA commands.
pattern write sectel/%u/ev
pattern read sectel/%u/ota