# Sectel broker: MQTT over TLS with mandatory client certificates (mTLS).
# Run from backend/:  mosquitto -c mosquitto.conf -v
per_listener_settings true

listener 8883 0.0.0.0
cafile   ../pki/ca.crt
certfile ../pki/broker.crt
keyfile  ../pki/broker.key
require_certificate true
use_identity_as_username true      # certificate CN becomes the username
allow_anonymous false
acl_file acl.conf

# Keep subscriptions and queued QoS 1 messages across broker restarts
persistence true
persistence_location ./mosquitto-data/
autosave_interval 10
